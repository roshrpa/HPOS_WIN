name: Build Windows app
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Hollywood-POS-Windows
          path: dist/*.exe
      - name: Publish installer as a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/*.exe Hollywood-POS-Setup.exe
          gh release delete win-latest --yes --cleanup-tag || true
          gh release create win-latest Hollywood-POS-Setup.exe --title "Hollywood POS for Windows (latest)" --notes "Download and run Hollywood-POS-Setup.exe. It installs over the old version."
